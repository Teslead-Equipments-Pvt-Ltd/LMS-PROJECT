{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LOGNOTE{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>

<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            LOGNOTE
        </div>

        <ul class="sidebar-menu">
            <li><a href="{% url 'dashboard_page' %}">Dashboard</a></li>
            <li><a href=" ">Notifications</a></li>
            <li><a href="{% url 'task_page' %}">Task</a></li>
            <li><a href="{% url 'project_page' %}">Project</a></li>
            <li><a href=" ">Assigned Tasks</a></li>
            <li><a href=" ">Task Request</a></li>
            <li><a href="{% url 'employee_page' %} ">Employees</a></li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div class="main-wrapper">

        <!-- Top Header Bar -->
        <div class="topbar">
            <div class="user-info">
                Welcome, <strong>{{ request.session.user_name|default:"Admin" }}</strong>
            </div>
            <a href="{% url 'loginpage' %}" class="logout-link">Logout</a>
        </div>

        <!-- Content Body -->
        <div class="content-area">
            {% block content %}
            <div class="card">
                <h2>Welcome to LMS Dashboard</h2>
            </div>
            {% endblock %}
        </div>

    </div>

</body>

</html>
