{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Note - Login</title>
    <link rel="stylesheet" href="{% static 'css/loginpage.css' %}">
    <link rel="stylesheet" href="{% static 'sweetalert2/sweetalert2.min.css' %}">
    <script src="{% static 'sweetalert2/sweetalert2.min.js' %}"></script>
</head>

<body>

    <div class="login-container">
        <div class="login-card">

            <div class="logo">
                <h1>LOGNOTE</h1>
                <p><b>WELCOME</b></p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" autocomplete="off" onsubmit="submitLogin(event)">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off"
                        required>
                    <span class="field-error-text" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter password"
                            autocomplete="new-password" required>
                        <span class="toggle-password" id="login_password_toggle" onclick="togglePasswordVisibility('password', this)" title="Toggle Password Visibility">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </span>
                    </div>
                    <span class="field-error-text" id="password-error"></span>
                </div>

                <button type="submit" id="loginBtn">Login</button>
            </form>

        </div>
    </div>

    <!-- JavaScript fetch() POST Handler -->
    <script>
        function togglePasswordVisibility(inputId, toggleEl) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';

            const eyeOpen = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            const eyeOff = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

            toggleEl.innerHTML = isPassword ? eyeOff : eyeOpen;
        }

        // Clear any browser-cached/autofilled credentials on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loginForm')?.reset();
                const u = document.getElementById('username');
                const p = document.getElementById('password');
                if (u) u.value = '';
                if (p) p.value = '';
            }, 50);
        });

        window.addEventListener('pageshow', () => {
            document.getElementById('loginForm')?.reset();
            const u = document.getElementById('username');
            const p = document.getElementById('password');
            if (u) u.value = '';
            if (p) p.value = '';
        });

        async function submitLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const username = usernameInput ? usernameInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value.trim() : '';
            const loginBtn = document.getElementById('loginBtn');

            const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
            const csrf = csrfInput ? csrfInput.value : '';

            if (!username || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Warning',
                    text: 'Please enter both username and password.',
                    width: '350px',
                    confirmButtonText: 'OK'
                });
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Login...';

            try {
                const response = await fetch('/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrf
                    },
                    body: JSON.stringify({ username: username, password: password })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    window.location.href = data.redirect_url || '/dashboard/';
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: data.message || 'Invalid Username/Employee ID or Password.',
                        width: '350px',
                        confirmButtonText: 'OK'
                    });
                }
            } catch (err) {
                console.error('Login error:', err);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Network error. Please try again.',
                    width: '350px',
                    confirmButtonText: 'OK'
                });
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }
    </script>

</body>

</html>
